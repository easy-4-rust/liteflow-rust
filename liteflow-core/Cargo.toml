[package]
name = "liteflow-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A semantic port of LiteFlow (dromara/liteflow) component-based rule engine to Rust"
license = "Apache-2.0"

[lib]
name = "liteflow_core"

[features]
default = []

[dependencies]
tokio = { version = "1.52.4", features = ["rt-multi-thread", "time", "sync", "macros"] }
async-trait = "0.1.89"
async-recursion = "1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
humantime-serde.workspace = true
dashmap = "6.1.0"
thiserror = "2.0.18"
rhai = { version = "1.25.1", features = ["sync", "serde"] }
quick-xml = "0.41.0"
serde_yaml_ng = "0.10.0"
md-5 = "0.10.6"
chrono = "0.4.45"
rand = "0.8.7"
log = "0.4.29"

[dev-dependencies]
tempfile.workspace = true
