[package]
name = "liteflow-core"
version = "0.1.0"
edition = "2021"
description = "A semantic port of LiteFlow (dromara/liteflow) component-based rule engine to Rust"
license = "Apache-2.0"

[lib]
name = "liteflow_core"

[features]
default = []
lua = ["dep:mlua"]
redis = ["dep:redis"]
sql = ["dep:rusqlite"]
apollo = ["dep:ureq"]
nacos = ["dep:nacos-sdk"]
etcd = ["dep:etcd-client"]
zk = ["dep:zookeeper"]

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
async-recursion = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
thiserror = "2"
rhai = { version = "1", features = ["sync", "serde"] }
quick-xml = { version = "0.36", features = ["serialize"] }
serde_yaml = "0.9"
md5 = "0.7"
mlua = { version = "0.10", features = ["lua54", "vendored"], optional = true }
redis = { version = "0.27", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
ureq = { version = "2", features = ["json"], optional = true }
nacos-sdk = { version = "0.3", optional = true }
etcd-client = { version = "0.14", optional = true }
zookeeper = { version = "0.8", optional = true }
